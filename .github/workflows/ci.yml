name: Persistent Counter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_USER: counter_ci
      POSTGRES_PASSWORD: counter_ci_password
      POSTGRES_DB: counter_ci_db

    steps:
      - name: Download repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build and start app with PostgreSQL
        run: docker compose up -d --build

      - name: Check counter reads and updates
        run: |
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:3006/ | grep -F '<p class="count">0</p>'

          curl -fsS -X POST -o /dev/null \
            http://127.0.0.1:3006/increment

          curl -fsS http://127.0.0.1:3006/ \
            | grep -F '<p class="count">1</p>'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop test containers
        if: always()
        run: docker compose down